<!doctype html><meta charset="utf-8"><title>sending</title><body>sending…
<script>
(async()=>{const items=[['wys-skool-preview.mp4','video/mp4','While-You-Sleep-Storefront-setup.mp4'],['wys-pinterest-results.png','image/png','Pinterest-results-Oct19-Nov18.png']];
const out=[];for(const [f,t,n] of items){const b=await (await fetch(f)).blob();out.push(new File([b],n,{type:t}));}
const tgt=window.parent!==window?window.parent:window.opener; if(!tgt){document.body.textContent='no target';return;}
tgt.postMessage({wysFiles:out},'https://www.skool.com');document.body.textContent='sent '+out.length;})();
</script>
