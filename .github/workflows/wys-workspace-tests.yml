name: WYS workspace tests
on:
  pull_request:
    paths:
      - 'src/worker/api/wys-workspace.js'
      - 'src/worker/auth.js'
      - 'wys-customer-assistant/**'
      - '.github/workflows/wys-workspace-tests.yml'
  workflow_dispatch:
jobs:
  workspace-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test wys-customer-assistant/workspace.test.mjs
