name: Friday canon audit

on:
  schedule:
    - cron: "0 12 * * 5"   # Fridays, 12:00 UTC (8am ET)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tdie_audit.py (repo + live)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ops/scripts/tdie_audit.py --repo --live --report audit.md
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-audit-report
          path: audit.md
          retention-days: 90
