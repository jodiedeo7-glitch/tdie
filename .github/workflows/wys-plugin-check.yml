name: WYS plugin checks

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wys-plugin-check.yml'
      - 'plugins/wys-storefront/**'
      - 'ops/wys-runtime/**'
      - '.agents/plugins/marketplace.json'
  push:
    branches: [main, 'build/wys-*', 'fix/wys-*']
    paths:
      - '.github/workflows/wys-plugin-check.yml'
      - 'plugins/wys-storefront/**'
      - 'ops/wys-runtime/**'
      - '.agents/plugins/marketplace.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wys-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install MCP server dependencies
        run: python -m pip install -r plugins/wys-storefront/server/requirements.txt
      - name: Run plugin and runtime tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .wys-checks
          python -m unittest discover -s plugins/wys-storefront/tests -p 'test_*.py' -v 2>&1 | tee .wys-checks/plugin-tests.log
          python -m unittest discover -s ops/wys-runtime -p 'test_*.py' -v 2>&1 | tee .wys-checks/runtime-tests.log
      - name: Build and compare development packages
        shell: bash
        run: |
          set -euo pipefail
          python plugins/wys-storefront/build_package.py --output .wys-checks/wys-development.zip | tee .wys-checks/build.json
          python plugins/wys-storefront/build_package.py --output .wys-checks/wys-development-repeat.zip
          cmp .wys-checks/wys-development.zip .wys-checks/wys-development-repeat.zip
          sha256sum .wys-checks/wys-development.zip > .wys-checks/package.sha256
      - name: Retain development package and synthetic verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wys-development-check-${{ github.sha }}
          path: |
            .wys-checks/plugin-tests.log
            .wys-checks/runtime-tests.log
            .wys-checks/build.json
            .wys-checks/package.sha256
            .wys-checks/wys-development.zip
          if-no-files-found: error
          retention-days: 30
