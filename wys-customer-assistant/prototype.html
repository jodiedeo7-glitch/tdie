<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WYS Setup | Private prototype</title><style>
:root{font-family:Inter,Arial,sans-serif;color:#1A1417;background:#FBF8F5}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:24px}header{background:#D62E73;color:white;padding:24px;border-bottom:5px solid #FF8AC2}h1,h2{font-family:Newsreader,Georgia,serif;font-style:normal}h1{font-size:clamp(30px,5vw,42px);margin:0}h2{font-size:28px}section{background:white;border:2px solid #FF8AC2;border-radius:18px;padding:22px;margin-top:24px;box-shadow:0 8px 0 #f9d6e8}label{display:block;font-weight:700;margin:16px 0 6px}input,select,textarea{width:100%;padding:14px;border:2px solid #D62E73;border-radius:10px;font:inherit;background:white;color:#1A1417}button{padding:14px 22px;background:#D62E73;color:white;border:0;border-radius:12px;font-weight:800;min-height:48px;cursor:pointer}button.secondary{background:#1A1417}button:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.hint{font-size:14px}progress{width:100%;accent-color:#D62E73}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#FBF8F5;padding:14px;border-radius:10px} .pill{display:inline-block;background:#FF8AC2;padding:7px 12px;border-radius:99px;font-weight:800} :focus-visible{outline:3px solid #1A1417;outline-offset:3px}
</style></head><body><header><h1>The While-You-Sleep Storefront™</h1><p>Customer setup • private prototype • not connected to accounts</p></header><main><p class="pill">UNRELEASED DEMO</p><p>This local prototype collects setup preferences only. It does not verify purchases, connect accounts, generate images, spend money, or publish.</p><progress id="progress" max="5" value="1"></progress><div id="app"></div></main><script>
const steps=[
{title:"Your storefront",fields:[["niche","Your niche or theme","text"],["categories","Product categories (comma-separated)","text"],["idea","First shopping idea","text"]]},
{title:"Amazon path",fields:[["amazonPath","Your Amazon program","select",["Not set up","Associates","Influencer","Unsure"]],["destination","Your website or storefront destination URL","url"]]},
{title:"Where you'll post",fields:[["pinterest","Pinterest account or profile URL","text"],["boards","Pinterest boards (comma-separated)","text"],["instagram","Instagram account (optional)","text"],["website","Blog or website URL (optional)","url"]]},
{title:"Your workflow",fields:[["mode","Workflow mode","select",["Manual","Mixed / assisted"]],["cadence","Preferred posting cadence","text"],["budget","Maximum approved generation budget in USD (optional)","number"],["avatar","Include an AI persona?","select",["No","Yes, with my approved reference"]]]},
{title:"Review setup",fields:[]}
];
const key="wys-setup-demo-v1";let state={};try{state=JSON.parse(localStorage.getItem(key)||"{}")||{}}catch{};let step=0;
function save(){localStorage.setItem(key,JSON.stringify(state))}
function render(){document.getElementById("progress").value=step+1;const root=document.getElementById("app");root.replaceChildren();const section=document.createElement("section");const h=document.createElement("h2");h.textContent=(step+1)+". "+steps[step].title;section.append(h);
if(step===4){const p=document.createElement("p");p.textContent="Review your preferences. Missing connections remain unverified. No publishing authorization is granted.";section.append(p);const pre=document.createElement("pre");pre.textContent=JSON.stringify(state,null,2);section.append(pre)}else{for(const [name,label,type,options] of steps[step].fields){const l=document.createElement("label");l.htmlFor=name;l.textContent=label;let el;if(type==="select"){el=document.createElement("select");for(const value of options){const opt=document.createElement("option");opt.value=value;opt.textContent=value;el.append(opt)}}else{el=document.createElement("input");el.type=type;if(type==="number"){el.min="0";el.step=".01"}}el.id=name;el.value=state[name]??"";el.addEventListener("input",()=>{state[name]=el.value;save()});section.append(l,el)}}
const actions=document.createElement("div");actions.className="actions";if(step){const back=document.createElement("button");back.textContent="Back";back.className="secondary";back.onclick=()=>{step--;render()};actions.append(back)}if(step<4){const next=document.createElement("button");next.textContent="Save & continue";next.onclick=()=>{save();step++;render()};actions.append(next)}else{const exportButton=document.createElement("button");exportButton.textContent="Download setup JSON";exportButton.onclick=()=>{const blob=new Blob([JSON.stringify({schemaVersion:1,preferences:state,connectionsVerified:false,publishingAuthorized:false},null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="wys-setup.json";a.click();URL.revokeObjectURL(url)};actions.append(exportButton)}
section.append(actions);root.append(section)}render();
</script></body></html>
